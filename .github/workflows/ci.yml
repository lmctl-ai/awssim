name: Build, test and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check automatic version and release gate
        run: |
          python3 scripts/test-release-version.py
          python3 scripts/test-release-publisher.py
      - id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            version="$(bash scripts/derive-release-version.sh "$GITHUB_RUN_NUMBER")"
            release=true
          else
            version="$(bash scripts/derive-release-version.sh --diagnostic)"
            release=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "awssim version $version (release=$release)"
  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, name: linux-x64, java: '25.0.2', ext: ''}
          - {os: ubuntu-22.04-arm, name: linux-arm64, java: '25.0.2', ext: ''}
          - {os: macos-15, name: macos-arm64, java: '25.0.2', ext: ''}
          - {os: macos-15-intel, name: macos-x64, java: '25.0.1', ext: ''}
          - {os: windows-2022, name: windows-x64, java: '25.0.2', ext: '.exe'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.name == 'macos-arm64' && 90 || 60 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Stamp CI release version into the checkout
        run: printf '%s\n' '${{ needs.version.outputs.version }}' > VERSION
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: ${{ matrix.java }}
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: maven-cache
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential zlib1g-dev
      - name: Install test client
        run: python -m pip install awscli==1.44.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: runner.os != 'Windows'
        with:
          node-version: '24'
      - name: Current lmscript compiler in a private prefix
        if: runner.os != 'Windows'
        run: |
          npm install --prefix "$RUNNER_TEMP/compiler" --no-save --package-lock=false @lmctl-ai/lmctl@latest
          echo "$RUNNER_TEMP/compiler/node_modules/.bin" >> "$GITHUB_PATH"
          echo "LMSCRIPT_BIN=$RUNNER_TEMP/compiler/node_modules/.bin/lmscript" >> "$GITHUB_ENV"
      - name: Pinned lmaws client
        if: runner.os != 'Windows'
        run: python scripts/fetch-test-client.py
      - name: Build native executable from verified source
        env:
          # The standard Apple Silicon runner has only ~7.5 GB RAM. Keep the
          # Maven exits before native-image starts; G1 shares its heap flexibly.
          NATIVE_XMX: ${{ matrix.name == 'macos-arm64' && '5g' || '7g' }}
          NATIVE_USE_G1: ${{ matrix.name == 'macos-arm64' && '1' || '0' }}
          MAVEN_OPTS: '-Xmx1536m'
          NATIVE_DETACHED: ${{ matrix.name == 'macos-arm64' && '1' || '0' }}
        run: |
          python scripts/test-build.py
          python scripts/build.py
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.maven-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}
      - name: Verify CLI and real AWS service lifecycles
        run: |
          python scripts/test-error-templates.py
          python scripts/test-cli.py "$PWD/dist/awssim${{ matrix.ext }}"
          python scripts/test-integration.py "$PWD/dist/awssim${{ matrix.ext }}"
          AWSSIM_TEST_AUTH=1 python scripts/test-integration.py "$PWD/dist/awssim${{ matrix.ext }}"
          python scripts/test-auth.py "$PWD/dist/awssim${{ matrix.ext }}"
      - name: Verify template requests and SDK integration
        if: runner.os != 'Windows'
        run: python scripts/test-templates.py "$PWD/dist/awssim${{ matrix.ext }}"
      - name: Name release binary
        run: mv 'dist/awssim${{ matrix.ext }}' 'dist/awssim-${{ matrix.name }}${{ matrix.ext }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: awssim-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
  parity-ddb:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25.0.2'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: maven-cache
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build JVM package and run DynamoDB Parity Suite
        env:
          MAVEN_OPTS: '-Xmx1536m'
        run: |
          python scripts/build.py --jvm
          bash scripts/test-parity-ddb.sh
  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, native, parity-ddb]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Publish tested binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp LICENSE FLOCI-LICENSE upstream.lock.json dist/
          (cd dist && sha256sum awssim-* LICENSE FLOCI-LICENSE upstream.lock.json > SHA256SUMS)
          scripts/publish-release.sh "v$RELEASE_VERSION" "$GITHUB_WORKSPACE/dist"
